name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT: kirana-agent
  GCP_REGION: us-central1
  REPO_NAME: kirana-agent-images
  SERVICE: kirana-agent-bot
  IMAGE: us-central1-docker.pkg.dev/kirana-agent/kirana-agent-images/kirana-agent-bot

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf2.0-0
      - name: Install Python deps
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -m "not e2e" -v
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf2.0-0
      - name: Install Python deps
        run: pip install -e ".[dev]"
      - name: E2E tests (real Gemini)
        run: pytest -m e2e -v --timeout=120
        timeout-minutes: 10
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --min-instances 0 \
            --max-instances 3 \
            --memory 1Gi \
            --cpu 1 \
            --concurrency 1 \
            --no-allow-unauthenticated \
            --set-secrets="GOOGLE_API_KEY=kirana-gemini-key:latest" \
            --set-secrets="TELEGRAM_BOT_TOKEN=kirana-telegram-token:latest" \
            --set-secrets="DATABASE_URL=kirana-db-url:latest" \
            --set-env-vars="OUTPUT_DIR=/tmp,SERVICE_URL=https://${{ env.SERVICE }}-${{ env.GCP_PROJECT }}.us-central1.run.app"

      - name: Verify deployment URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format="value(status.url)")
          echo "Deployed to: $URL"
          echo "Health: $URL/health"
