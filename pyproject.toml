[project]
name = "kirana-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg2-binary",
    "python-dotenv",
    "google-adk",
    "google-genai",
    "python-telegram-bot",
    "weasyprint",
    "python-pptx",
    "matplotlib",
    "jinja2",
    "supabase",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "httpx",
]

[project.scripts]
kirana-bot = "kirana.bot.telegram_bot:main"
kirana-cli = "kirana.agent.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
